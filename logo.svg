<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d0b"/>
      <stop offset="50%" stop-color="#101712"/>
      <stop offset="100%" stop-color="#070908"/>
    </linearGradient>
    <linearGradient id="limeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8f25a"/>
      <stop offset="50%" stop-color="#70e28f"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8f25a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect x="16" y="16" width="480" height="480" rx="115" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="115" fill="none" stroke="#c8f25a" stroke-width="2" stroke-opacity="0.18"/>
  <rect x="18" y="18" width="476" height="476" rx="113" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.1"/>

  <!-- Subtle grid lines in background -->
  <path d="M120 160 H392 M120 256 H392 M120 352 H392" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <path d="M160 120 V392 M256 120 V392 M352 120 V392" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Connected "N" (Node) structure -->
  <!-- Connection circuit lines -->
  <g filter="url(#glow)">
    <!-- Left vertical trunk -->
    <line x1="168" y1="140" x2="168" y2="372" stroke="#c8f25a" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Diagonal trace -->
    <line x1="168" y1="140" x2="344" y2="372" stroke="url(#lineGrad)" stroke-width="26" stroke-linecap="round"/>
    
    <!-- Right vertical trunk -->
    <line x1="344" y1="140" x2="344" y2="372" stroke="#38bdf8" stroke-width="24" stroke-linecap="round"/>

    <!-- Central Node Core -->
    <circle cx="256" cy="256" r="22" fill="#101712" stroke="url(#limeCyan)" stroke-width="6"/>
    <circle cx="256" cy="256" r="10" fill="#c8f25a"/>

    <!-- Terminal nodes -->
    <circle cx="168" cy="140" r="28" fill="#101712" stroke="#c8f25a" stroke-width="7"/>
    <circle cx="168" cy="140" r="13" fill="#c8f25a"/>

    <circle cx="168" cy="372" r="28" fill="#101712" stroke="#c8f25a" stroke-width="7"/>
    <circle cx="168" cy="372" r="13" fill="#c8f25a"/>

    <circle cx="344" cy="140" r="28" fill="#101712" stroke="#38bdf8" stroke-width="7"/>
    <circle cx="344" cy="140" r="13" fill="#38bdf8"/>

    <circle cx="344" cy="372" r="28" fill="#101712" stroke="#38bdf8" stroke-width="7"/>
    <circle cx="344" cy="372" r="13" fill="#38bdf8"/>
  </g>
</svg>